<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240" role="img" aria-label="星空欢迎横幅">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#101828"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="gCyan">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gViolet">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gAmber">
      <stop offset="0" stop-color="#f0883e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d2c0"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39d2c0"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6edf3" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .star { fill:#e6edf3; animation: tw 3.2s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.12; } 50% { opacity:1; } }
    .neb { transform-box: fill-box; transform-origin: center; animation: neb 11s ease-in-out infinite; }
    .neb.d1 { animation-delay:-3.6s; } .neb.d2 { animation-delay:-7.2s; }
    @keyframes neb { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.14); } }
    .shoot { animation: shoot 7s linear infinite; }
    @keyframes shoot {
      0%,80% { transform:translate(0,0); opacity:0; }
      83% { opacity:1; }
      95% { transform:translate(-400px,158px); opacity:1; }
      96%,100% { transform:translate(-400px,158px); opacity:0; }
    }
    .drift { animation: drift 42s linear infinite; }
    @keyframes drift { from { transform:translate(-130px,0); } to { transform:translate(1080px,0); } }
    .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform:translate(0,-3px); } 50% { transform:translate(0,3px); } }
    .flick { animation: flick .18s linear infinite alternate; }
    @keyframes flick { from { opacity:1; } to { opacity:.25; } }
    .win { fill:#ffb86c; animation: tw 4.5s ease-in-out infinite; }
    .beacon { fill:#ff7b72; animation: beacon 1.6s steps(1) infinite; }
    @keyframes beacon { 0%,60% { opacity:1; } 61%,100% { opacity:.1; } }
    .titlePulse { animation: titlePulse 4s ease-in-out infinite; }
    @keyframes titlePulse { 0%,100% { opacity:.82; } 50% { opacity:1; } }
    .sparkle { fill:#e6edf3; animation: tw 2.6s ease-in-out infinite; }
  </style>

  <!-- 底色 -->
  <rect x="0" y="0" width="940" height="240" rx="14" fill="url(#bgGrad)"/>

  <!-- 星云（缓慢呼吸） -->
  <circle class="neb"    cx="205" cy="72"  r="95"  fill="url(#gCyan)"/>
  <circle class="neb d1" cx="755" cy="82"  r="112" fill="url(#gViolet)"/>
  <circle class="neb d2" cx="478" cy="150" r="80"  fill="url(#gAmber)"/>

  <!-- 星星 -->
  <circle class="star" cx="40"  cy="30"  r="1.4" style="animation-delay:-0.2s"/>
  <circle class="star" cx="90"  cy="70"  r="1.0" style="animation-delay:-1.2s"/>
  <circle class="star" cx="150" cy="40"  r="1.2" style="animation-delay:-2.1s"/>
  <circle class="star" cx="210" cy="92"  r="0.9" style="animation-delay:-0.6s"/>
  <circle class="star" cx="262" cy="25"  r="1.5" style="animation-delay:-1.8s"/>
  <circle class="star" cx="332" cy="55"  r="1.0" style="animation-delay:-0.3s"/>
  <circle class="star" cx="396" cy="30"  r="1.3" style="animation-delay:-2.4s"/>
  <circle class="star" cx="560" cy="34"  r="1.1" style="animation-delay:-1.5s"/>
  <circle class="star" cx="622" cy="62"  r="0.9" style="animation-delay:-0.9s"/>
  <circle class="star" cx="682" cy="25"  r="1.4" style="animation-delay:-0.2s"/>
  <circle class="star" cx="732" cy="66"  r="1.0" style="animation-delay:-1.9s"/>
  <circle class="star" cx="792" cy="42"  r="1.2" style="animation-delay:-0.8s"/>
  <circle class="star" cx="852" cy="76"  r="1.5" style="animation-delay:-2.2s"/>
  <circle class="star" cx="902" cy="30"  r="1.0" style="animation-delay:-1.4s"/>
  <circle class="star" cx="880" cy="112" r="0.8" style="animation-delay:-0.5s"/>
  <circle class="star" cx="58"  cy="132" r="1.1" style="animation-delay:-2.0s"/>
  <circle class="star" cx="700" cy="150" r="1.0" style="animation-delay:-0.4s"/>
  <circle class="star" cx="762" cy="184" r="1.2" style="animation-delay:-1.7s"/>
  <circle class="star" cx="842" cy="170" r="0.9" style="animation-delay:-2.6s"/>
  <circle class="star" cx="120" cy="176" r="0.9" style="animation-delay:-1.1s"/>
  <path class="sparkle" d="M300,41 l1.2,2.8 2.8,1.2 -2.8,1.2 -1.2,2.8 -1.2,-2.8 -2.8,-1.2 2.8,-1.2 Z" style="animation-delay:-1.0s"/>
  <path class="sparkle" d="M642,116 l1.1,2.5 2.5,1.1 -2.5,1.1 -1.1,2.5 -1.1,-2.5 -2.5,-1.1 2.5,-1.1 Z" style="animation-delay:-0.3s"/>
  <path class="sparkle" d="M184,144 l1.0,2.3 2.3,1.0 -2.3,1.0 -1.0,2.3 -1.0,-2.3 -2.3,-1.0 2.3,-1.0 Z" style="animation-delay:-1.9s"/>

  <!-- 流星 -->
  <g class="shoot" transform="translate(770,24)">
    <line x1="0" y1="0" x2="96" y2="-38" stroke="url(#tailGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.1" fill="#ffffff"/>
  </g>

  <!-- 缓慢巡航的小火箭 -->
  <g class="drift">
    <g class="bob" transform="translate(0,96)">
      <g transform="rotate(-6)">
        <path d="M-2,0 L-13,-4 L-8,0 L-13,4 Z" fill="#ffb86c" class="flick"/>
        <path d="M-1,0 L-9,-2.4 L-6,0 L-9,2.4 Z" fill="#ff7b72" class="flick" style="animation-delay:-.09s"/>
        <path d="M2,-5 L-5,-11 L-1,-5 Z" fill="#39d2c0"/>
        <path d="M2,5 L-5,11 L-1,5 Z" fill="#39d2c0"/>
        <rect x="0" y="-5.5" width="23" height="11" rx="5.5" fill="#e6edf3"/>
        <path d="M23,-5.5 L31,0 L23,5.5 Z" fill="#ff7b72"/>
        <circle cx="8" cy="0" r="2.6" fill="#58a6ff" stroke="#0d1117" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- 标题 -->
  <text x="470" y="80" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#39d2c0">WELCOME TO MY GITHUB</text>
  <text class="titlePulse" x="470" y="120" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="36" font-weight="800" letter-spacing="3" fill="url(#titleGrad)" filter="url(#glow)">HELLO , WORLD !</text>
  <text x="470" y="152" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" letter-spacing="9" fill="#8b949e">代码 · 创造 · 分享</text>

  <!-- 城市天际线 -->
  <g fill="#161b22">
    <rect x="0"   y="206" width="40" height="34"/>
    <rect x="44"  y="220" width="32" height="20"/>
    <rect x="80"  y="194" width="52" height="46"/>
    <rect x="136" y="214" width="36" height="26"/>
    <rect x="176" y="202" width="44" height="38"/>
    <rect x="224" y="218" width="30" height="22"/>
    <rect x="258" y="190" width="60" height="50"/>
    <rect x="322" y="212" width="40" height="28"/>
    <rect x="366" y="204" width="48" height="36"/>
    <rect x="418" y="220" width="28" height="20"/>
    <rect x="450" y="170" width="70" height="70"/>
    <rect x="524" y="214" width="34" height="26"/>
    <rect x="562" y="202" width="46" height="38"/>
    <rect x="612" y="218" width="30" height="22"/>
    <rect x="646" y="196" width="56" height="44"/>
    <rect x="706" y="212" width="38" height="28"/>
    <rect x="748" y="204" width="44" height="36"/>
    <rect x="796" y="220" width="28" height="20"/>
    <rect x="828" y="192" width="52" height="48"/>
    <rect x="884" y="214" width="26" height="26"/>
    <rect x="914" y="204" width="26" height="36"/>
  </g>
  <line x1="485" y1="170" x2="485" y2="156" stroke="#2b3d52" stroke-width="2"/>
  <circle class="beacon" cx="485" cy="154" r="2.4"/>

  <!-- 亮着的窗 -->
  <rect class="win" x="90"  y="202" width="3" height="4" style="animation-delay:-0.9s"/>
  <rect class="win" x="100" y="210" width="3" height="4" style="animation-delay:-2.2s"/>
  <rect class="win" x="268" y="200" width="3" height="4" style="animation-delay:-1.3s"/>
  <rect class="win" x="282" y="214" width="3" height="4" style="animation-delay:-0.4s"/>
  <rect class="win" x="462" y="182" width="3" height="4" style="animation-delay:-1.8s"/>
  <rect class="win" x="476" y="196" width="3" height="4" style="animation-delay:-3.0s"/>
  <rect class="win" x="502" y="210" width="3" height="4" style="animation-delay:-0.7s"/>
  <rect class="win" x="576" y="212" width="3" height="4" style="animation-delay:-2.6s"/>
  <rect class="win" x="660" y="206" width="3" height="4" style="animation-delay:-1.1s"/>
  <rect class="win" x="672" y="218" width="3" height="4" style="animation-delay:-0.2s"/>
  <rect class="win" x="760" y="212" width="3" height="4" style="animation-delay:-2.0s"/>
  <rect class="win" x="840" y="200" width="3" height="4" style="animation-delay:-1.5s"/>
  <rect class="win" x="852" y="214" width="3" height="4" style="animation-delay:-0.6s"/>
  <rect class="win" x="920" y="212" width="3" height="4" style="animation-delay:-2.8s"/>

  <!-- 边框 -->
  <rect x="1" y="1" width="938" height="238" rx="14" fill="none" stroke="#2b3d52" stroke-width="2"/>
</svg>
