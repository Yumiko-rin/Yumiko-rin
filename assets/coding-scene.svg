<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-label="深夜编程场景">
  <defs>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .star { fill:#e6edf3; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.1; } 50% { opacity:1; } }
    .code { transform-box:fill-box; transform-origin:left center; animation: codeIn 7s ease-in-out infinite; }
    @keyframes codeIn {
      0%   { transform:scaleX(0); opacity:1; }
      5%   { transform:scaleX(1); }
      78%  { transform:scaleX(1); opacity:1; }
      86%,100% { transform:scaleX(1); opacity:0; }
    }
    .caret { fill:#39d2c0; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity:1; } 56%,100% { opacity:0; } }
    .glow { animation: glowPulse 5s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    .steam { fill:none; stroke:#8b949e; stroke-width:2; stroke-linecap:round; animation: rise 2.8s ease-out infinite; }
    @keyframes rise { 0% { opacity:0; transform:translateY(4px); } 25% { opacity:.65; } 100% { opacity:0; transform:translateY(-16px); } }
    .wag { transform-box:fill-box; transform-origin:8% 92%; animation: wag 1.9s ease-in-out infinite; }
    @keyframes wag { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(10deg); } }
    .eyeBlink { transform-box:fill-box; transform-origin:center; animation: eyeBlink 4.6s linear infinite; }
    @keyframes eyeBlink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.08); } }
    .leaf { transform-box:fill-box; transform-origin:bottom center; animation: sway 4.2s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(3.5deg); } }
    .shoot { animation: shoot 6.5s linear infinite; }
    @keyframes shoot {
      0%,84% { transform:translate(0,0); opacity:0; }
      87% { opacity:1; }
      97% { transform:translate(-150px,60px); opacity:1; }
      98%,100% { transform:translate(-150px,60px); opacity:0; }
    }
  </style>

  <!-- 房间 -->
  <rect x="1" y="1" width="818" height="378" rx="14" fill="#0d1117" stroke="#2b3d52" stroke-width="2"/>
  <rect x="2" y="312" width="816" height="65" rx="12" fill="#10151d"/>
  <line x1="2" y1="312" x2="818" y2="312" stroke="#1c2431" stroke-width="2"/>

  <!-- 墙上的星星 -->
  <circle class="star" cx="250" cy="72"  r="1.2" style="animation-delay:-.5s"/>
  <circle class="star" cx="420" cy="46"  r="1.0" style="animation-delay:-1.7s"/>
  <circle class="star" cx="510" cy="120" r="0.9" style="animation-delay:-2.3s"/>
  <circle class="star" cx="44"  cy="252" r="1.0" style="animation-delay:-1.0s"/>
  <circle class="star" cx="772" cy="246" r="1.1" style="animation-delay:-2.8s"/>

  <!-- 海报 -->
  <g>
    <rect x="82" y="66" width="112" height="142" rx="6" fill="#101828" stroke="#2b3d52" stroke-width="2.5"/>
    <text x="138" y="130" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="26" font-weight="bold" fill="#39d2c0">&lt;/&gt;</text>
    <text x="138" y="158" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="9" letter-spacing="2" fill="#8b949e">CODE IS ART</text>
    <circle cx="138" cy="74" r="2" fill="#58a6ff"/>
  </g>

  <!-- 窗户：夜空 -->
  <g>
    <rect x="560" y="60" width="200" height="150" rx="8" fill="#0a0f16" stroke="#2b3d52" stroke-width="6"/>
    <circle class="star" cx="596" cy="92"  r="1.1" style="animation-delay:-.8s"/>
    <circle class="star" cx="636" cy="70"  r="0.9" style="animation-delay:-2.0s"/>
    <circle class="star" cx="616" cy="160" r="1.0" style="animation-delay:-1.3s"/>
    <circle class="star" cx="724" cy="168" r="0.9" style="animation-delay:-2.6s"/>
    <circle class="star" cx="742" cy="84"  r="1.0" style="animation-delay:-.3s"/>
    <!-- 月亮 -->
    <circle cx="688" cy="104" r="15" fill="#e6edf3"/>
    <circle cx="695" cy="98"  r="13" fill="#0a0f16"/>
    <!-- 流星 -->
    <g class="shoot" transform="translate(742,66)">
      <line x1="0" y1="0" x2="42" y2="-17" stroke="#e6edf3" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>
    <!-- 窗棂 -->
    <line x1="660" y1="63" x2="660" y2="207" stroke="#2b3d52" stroke-width="5"/>
    <line x1="563" y1="135" x2="757" y2="135" stroke="#2b3d52" stroke-width="5"/>
    <rect x="552" y="212" width="216" height="9" rx="2" fill="#2b3d52"/>
  </g>

  <!-- 书桌 -->
  <rect x="232" y="252" width="336" height="12" rx="3" fill="#33465c"/>
  <line x1="234" y1="254" x2="566" y2="254" stroke="#3f5670" stroke-width="2"/>
  <rect x="240" y="264" width="10" height="56" fill="#2b3d52"/>
  <rect x="550" y="264" width="10" height="56" fill="#2b3d52"/>

  <!-- 笔记本电脑 -->
  <g>
    <ellipse class="glow" cx="360" cy="284" rx="130" ry="12" fill="url(#screenGlow)"/>
    <rect x="270" y="150" width="180" height="110" rx="8" fill="#161b22" stroke="#2b3d52" stroke-width="2"/>
    <rect x="280" y="160" width="160" height="90" fill="#0a0f16"/>
    <!-- 不断刷新的"代码" -->
    <rect class="code" x="290" y="170" width="64"  height="6" rx="3" fill="#ff7b72" style="animation-delay:0s"/>
    <rect class="code" x="290" y="182" width="120" height="6" rx="3" fill="#58a6ff" style="animation-delay:.35s"/>
    <rect class="code" x="302" y="194" width="96"  height="6" rx="3" fill="#39d2c0" style="animation-delay:.7s"/>
    <rect class="code" x="302" y="206" width="56"  height="6" rx="3" fill="#8b949e" style="animation-delay:1.05s"/>
    <rect class="code" x="290" y="218" width="132" height="6" rx="3" fill="#bc8cff" style="animation-delay:1.4s"/>
    <rect class="code" x="302" y="230" width="84"  height="6" rx="3" fill="#ffb86c" style="animation-delay:1.75s"/>
    <rect class="code" x="302" y="242" width="44"  height="6" rx="3" fill="#39d2c0" style="animation-delay:2.1s"/>
    <rect class="caret" x="352" y="242" width="7" height="8"/>
    <!-- 底座 -->
    <path d="M262,262 L458,262 L472,277 L248,277 Z" fill="#1c2733" stroke="#2b3d52" stroke-width="1.5"/>
    <line x1="270" y1="270" x2="450" y2="270" stroke="#2b3d52" stroke-width="2"/>
  </g>

  <!-- 咖啡杯 -->
  <g>
    <path class="steam" d="M498,216 C493,208 503,202 498,194" style="animation-delay:0s"/>
    <path class="steam" d="M510,218 C505,210 515,204 510,196" style="animation-delay:1.4s"/>
    <rect x="486" y="224" width="32" height="30" rx="5" fill="#e6edf3"/>
    <rect x="486" y="233" width="32" height="7" fill="#39d2c0"/>
    <path d="M518,230 a8,8 0 1,1 0,16" fill="none" stroke="#e6edf3" stroke-width="4"/>
    <ellipse cx="502" cy="226" rx="14" ry="3" fill="#7a4a21"/>
  </g>

  <!-- 小猫 -->
  <g>
    <ellipse cx="642" cy="314" rx="44" ry="7" fill="#000000" opacity=".3"/>
    <path class="wag" d="M674,300 C694,302 702,284 692,270" fill="none" stroke="#4a5568" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="640" cy="290" rx="34" ry="25" fill="#4a5568"/>
    <ellipse cx="640" cy="296" rx="20" ry="15" fill="#6b7686"/>
    <circle cx="640" cy="252" r="21" fill="#4a5568"/>
    <path d="M626,240 L621,222 L636,232 Z" fill="#4a5568"/>
    <path d="M628,238 L625,228 L633,234 Z" fill="#f2a4b8"/>
    <path d="M654,240 L659,222 L644,232 Z" fill="#4a5568"/>
    <path d="M652,238 L655,228 L647,234 Z" fill="#f2a4b8"/>
    <g class="eyeBlink">
      <circle cx="632" cy="250" r="3" fill="#39d2c0"/>
      <circle cx="648" cy="250" r="3" fill="#39d2c0"/>
    </g>
    <path d="M638,257 L642,257 L640,260 Z" fill="#f2a4b8"/>
    <path d="M640,260 q-3,4 -6,2 M640,260 q3,4 6,2" fill="none" stroke="#2d3748" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="626" y1="258" x2="608" y2="254" stroke="#2d3748" stroke-width="1.3"/>
    <line x1="626" y1="262" x2="609" y2="264" stroke="#2d3748" stroke-width="1.3"/>
    <line x1="654" y1="258" x2="672" y2="254" stroke="#2d3748" stroke-width="1.3"/>
    <line x1="654" y1="262" x2="671" y2="264" stroke="#2d3748" stroke-width="1.3"/>
    <ellipse cx="630" cy="312" rx="8" ry="5" fill="#5d6a7d"/>
    <ellipse cx="652" cy="312" rx="8" ry="5" fill="#5d6a7d"/>
  </g>

  <!-- 绿植 -->
  <g>
    <ellipse cx="118" cy="324" rx="30" ry="5" fill="#000000" opacity=".3"/>
    <g class="leaf" style="animation-delay:0s">    <ellipse cx="100" cy="258" rx="8"  ry="25" fill="#2ea88f" transform="rotate(-26 100 282)"/></g>
    <g class="leaf" style="animation-delay:-.9s"> <ellipse cx="112" cy="252" rx="8"  ry="27" fill="#39d2c0" transform="rotate(-13 112 278)"/></g>
    <g class="leaf" style="animation-delay:-1.8s"><ellipse cx="122" cy="250" rx="8"  ry="28" fill="#2ea88f"/></g>
    <g class="leaf" style="animation-delay:-2.7s"><ellipse cx="132" cy="252" rx="8"  ry="27" fill="#39d2c0" transform="rotate(13 132 278)"/></g>
    <g class="leaf" style="animation-delay:-3.6s"><ellipse cx="142" cy="258" rx="8"  ry="25" fill="#2ea88f" transform="rotate(26 142 282)"/></g>
    <rect x="94" y="282" width="48" height="9" rx="2" fill="#a06d45"/>
    <path d="M98,291 L138,291 L132,324 L104,324 Z" fill="#8b5e3c" stroke="#6e4a2f" stroke-width="2"/>
  </g>
</svg>
