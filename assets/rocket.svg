<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-label="飞行中的小火箭">
  <defs>
    <clipPath id="porthole"><circle cx="180" cy="180" r="168"/></clipPath>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#b8c4cf"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#131b2a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <style>
    .star { fill:#e6edf3; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.1; } 50% { opacity:.9; } }
    .streak { stroke:#e6edf3; stroke-linecap:round; animation: fall 1.8s linear infinite; }
    @keyframes fall { from { transform:translateY(-360px); } to { transform:translateY(380px); } }
    .bob { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform:translate(0,-10px); } 50% { transform:translate(0,10px); } }
    .f1 { animation: flick .16s linear infinite alternate; transform-box:fill-box; transform-origin:top center; }
    .f2 { animation: flick .11s linear infinite alternate-reverse; transform-box:fill-box; transform-origin:top center; }
    @keyframes flick { from { opacity:1; transform:scaleY(1); } to { opacity:.35; transform:scaleY(.72); } }
  </style>

  <!-- 舷窗底盘 -->
  <circle cx="180" cy="180" r="170" fill="#0d1117" stroke="#2b3d52" stroke-width="2"/>
  <circle cx="180" cy="180" r="168" fill="url(#disc)"/>

  <g clip-path="url(#porthole)">
    <!-- 星星 -->
    <circle class="star" cx="60"  cy="70"  r="1.3" style="animation-delay:-.4s"/>
    <circle class="star" cx="300" cy="55"  r="1.1" style="animation-delay:-1.6s"/>
    <circle class="star" cx="255" cy="140" r="0.9" style="animation-delay:-2.2s"/>
    <circle class="star" cx="85"  cy="250" r="1.2" style="animation-delay:-.9s"/>
    <circle class="star" cx="290" cy="285" r="1.4" style="animation-delay:-1.2s"/>
    <circle class="star" cx="45"  cy="160" r="0.9" style="animation-delay:-2.7s"/>

    <!-- 速度线：向下流动暗示向上飞行 -->
    <line class="streak" x1="70"  y1="20" x2="70"  y2="52"  stroke-width="2"   opacity=".55" style="animation-delay:0s"/>
    <line class="streak" x1="150" y1="-30" x2="150" y2="-4" stroke-width="1.5" opacity=".4"  style="animation-delay:-.9s"/>
    <line class="streak" x1="230" y1="60" x2="230" y2="88"  stroke-width="2"   opacity=".5"  style="animation-delay:-.4s"/>
    <line class="streak" x1="305" y1="10" x2="305" y2="48"  stroke-width="1.5" opacity=".45" style="animation-delay:-1.3s"/>
    <line class="streak" x1="110" y1="120" x2="110" y2="146" stroke-width="1.5" opacity=".35" style="animation-delay:-1.7s"/>
    <line class="streak" x1="262" y1="190" x2="262" y2="212" stroke-width="1.5" opacity=".4"  style="animation-delay:-.7s"/>
    <line class="streak" x1="95"  y1="310" x2="95"  y2="336" stroke-width="1.5" opacity=".4"  style="animation-delay:-2.1s"/>
    <line class="streak" x1="205" y1="270" x2="205" y2="300" stroke-width="2"   opacity=".5"  style="animation-delay:-1.1s"/>
  </g>

  <!-- 火箭本体 -->
  <g class="bob">
    <g transform="translate(180,178)">
      <!-- 尾焰 -->
      <path class="f1" d="M-11,52 L0,96 L11,52 Z" fill="#ffb86c"/>
      <path class="f2" d="M-6,52 L0,78 L6,52 Z" fill="#ff7b72"/>
      <!-- 尾翼 -->
      <path d="M-16,18 L-34,52 L-16,44 Z" fill="#ff7b72"/>
      <path d="M16,18 L34,52 L16,44 Z" fill="#ff7b72"/>
      <!-- 机身 -->
      <path d="M-16,44 L-16,4 Q-16,-40 0,-58 Q16,-40 16,4 L16,44 Z" fill="url(#body)" stroke="#8b949e" stroke-width="1.5"/>
      <!-- 舷窗 -->
      <circle cx="0" cy="-14" r="9" fill="#58a6ff" stroke="#0d1117" stroke-width="2.5"/>
      <circle cx="-2.5" cy="-16.5" r="2.6" fill="#a8d4ff"/>
      <!-- 机身条纹 -->
      <rect x="-16" y="26" width="32" height="7" fill="#ff7b72"/>
      <!-- 喷口 -->
      <rect x="-9" y="44" width="18" height="8" rx="2" fill="#8b949e"/>
    </g>
  </g>

  <!-- 环绕的小卫星 -->
  <g>
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" path="M 180,26 A 154,154 0 1,1 179.9,26 Z"/>
      <rect x="-5" y="-3" width="10" height="6" rx="1" fill="#39d2c0"/>
      <rect x="-11" y="-2" width="4" height="4" fill="#58a6ff"/>
      <rect x="7"  y="-2" width="4" height="4" fill="#58a6ff"/>
    </g>
  </g>
</svg>
