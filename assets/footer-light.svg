<svg xmlns="http://www.w3.org/2000/svg" width="940" height="120" viewBox="0 0 940 120" role="img" aria-label="页脚致谢（亮色）">
  <defs>
    <linearGradient id="fbgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8ff"/>
      <stop offset="0.5" stop-color="#e4eefb"/>
      <stop offset="1" stop-color="#f2f8ff"/>
    </linearGradient>
    <linearGradient id="ftL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea8a0"/>
      <stop offset="0.5" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#2ea8a0"/>
    </linearGradient>
    <filter id="fglowL" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .star { fill:#1f6feb; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.15; } 50% { opacity:.85; } }
    .title { animation: pulse 3.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.8; } 50% { opacity:1; } }
    .heart { transform-box:fill-box; transform-origin:center; animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat { 0%,100% { transform:scale(1); } 12% { transform:scale(1.28); } 24% { transform:scale(1); } 36% { transform:scale(1.18); } 48% { transform:scale(1); } }
    .win { fill:#f0883e; animation: tw 4.5s ease-in-out infinite; }
    .shoot { animation: shoot 9s linear infinite; }
    @keyframes shoot {
      0%,86% { transform:translate(0,0); opacity:0; }
      89% { opacity:1; }
      98% { transform:translate(-300px,70px); opacity:1; }
      99%,100% { transform:translate(-300px,70px); opacity:0; }
    }
  </style>

  <rect x="0" y="0" width="940" height="120" rx="14" fill="url(#fbgL)"/>

  <circle class="star" cx="60"  cy="26" r="1.2" style="animation-delay:-.4s"/>
  <circle class="star" cx="150" cy="44" r="1.0" style="animation-delay:-1.6s"/>
  <circle class="star" cx="250" cy="20" r="1.3" style="animation-delay:-2.2s"/>
  <circle class="star" cx="700" cy="22" r="1.2" style="animation-delay:-.8s"/>
  <circle class="star" cx="790" cy="46" r="1.0" style="animation-delay:-1.9s"/>
  <circle class="star" cx="880" cy="24" r="1.4" style="animation-delay:-2.6s"/>

  <g class="shoot" transform="translate(600,16)">
    <line x1="0" y1="0" x2="70" y2="-28" stroke="#1f6feb" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
    <circle cx="0" cy="0" r="1.7" fill="#1f6feb"/>
  </g>

  <!-- 两侧菱形星光 -->
  <path class="star" d="M330,44 l2.4,5.6 5.6,2.4 -5.6,2.4 -2.4,5.6 -2.4,-5.6 -5.6,-2.4 5.6,-2.4 Z" style="animation-delay:-1.2s"/>
  <path class="star" d="M610,44 l2.4,5.6 5.6,2.4 -5.6,2.4 -2.4,5.6 -2.4,-5.6 -5.6,-2.4 5.6,-2.4 Z" style="animation-delay:-.5s"/>

  <text class="title" x="470" y="56" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" letter-spacing="5" fill="url(#ftL)" filter="url(#fglowL)">THANKS FOR VISITING</text>
  <text x="470" y="84" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" letter-spacing="6" fill="#57606a">保持热爱 · 奔赴山海</text>

  <!-- 底部天际线 -->
  <g fill="#c7d9ec">
    <rect x="0"   y="96"  width="34" height="24"/>
    <rect x="38"  y="104" width="26" height="16"/>
    <rect x="68"  y="92"  width="40" height="28"/>
    <rect x="152" y="100" width="30" height="20"/>
    <rect x="336" y="98"  width="36" height="22"/>
    <rect x="560" y="102" width="28" height="18"/>
    <rect x="758" y="94"  width="42" height="26"/>
    <rect x="834" y="104" width="24" height="16"/>
    <rect x="862" y="98"  width="34" height="22"/>
    <rect x="912" y="104" width="28" height="16"/>
  </g>
  <rect class="win" x="80"  y="100" width="3" height="4" style="animation-delay:-1.4s"/>
  <rect class="win" x="346" y="104" width="3" height="4" style="animation-delay:-.7s"/>
  <rect class="win" x="770" y="102" width="3" height="4" style="animation-delay:-2.1s"/>
  <rect class="win" x="872" y="104" width="3" height="4" style="animation-delay:-1.1s"/>

  <!-- 心跳 -->
  <g transform="translate(778,80) scale(.9)">
    <path class="heart" d="M0,6 C-1,2 -8,-2 -8,-6 C-8,-10 -4,-11 0,-7 C4,-11 8,-10 8,-6 C8,-2 1,2 0,6 Z" fill="#ff7b72"/>
  </g>

  <rect x="1" y="1" width="938" height="118" rx="14" fill="none" stroke="#a9c3dd" stroke-width="2"/>
</svg>
