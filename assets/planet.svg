<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220" viewBox="0 0 380 220" role="img" aria-label="带环星球与卫星">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#35608f"/>
      <stop offset="0.55" stop-color="#234468"/>
      <stop offset="1" stop-color="#14263e"/>
    </linearGradient>
    <clipPath id="pclip"><circle cx="150" cy="110" r="78"/></clipPath>
  </defs>

  <style>
    .star { fill:#e6edf3; animation: tw 3.2s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.1; } 50% { opacity:.95; } }
    .rot { animation: rot 46s linear infinite; }
    @keyframes rot { from { transform:translateX(0); } to { transform:translateX(-320px); } }
    .shoot { animation: shoot 8s linear infinite; }
    @keyframes shoot {
      0%,82% { transform:translate(0,0); opacity:0; }
      85% { opacity:1; }
      96% { transform:translate(-180px,74px); opacity:1; }
      97%,100% { transform:translate(-180px,74px); opacity:0; }
    }
  </style>

  <!-- 背景星 -->
  <circle class="star" cx="320" cy="38"  r="1.4" style="animation-delay:-.6s"/>
  <circle class="star" cx="355" cy="105" r="1.0" style="animation-delay:-1.8s"/>
  <circle class="star" cx="300" cy="180" r="1.2" style="animation-delay:-2.4s"/>
  <circle class="star" cx="255" cy="25"  r="0.9" style="animation-delay:-1.1s"/>
  <circle class="star" cx="40"  cy="30"  r="1.1" style="animation-delay:-.2s"/>
  <circle class="star" cx="18"  cy="180" r="1.0" style="animation-delay:-2.9s"/>

  <!-- 流星 -->
  <g class="shoot" transform="translate(360,18)">
    <line x1="0" y1="0" x2="46" y2="-19" stroke="#e6edf3" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
    <circle cx="0" cy="0" r="1.6" fill="#ffffff"/>
  </g>

  <!-- 星环（后半，被星球遮住） -->
  <g transform="rotate(-16 150 110)">
    <ellipse cx="150" cy="110" rx="128" ry="30" fill="none" stroke="#8b949e" stroke-width="7" opacity=".65"/>
  </g>

  <!-- 星球本体 -->
  <circle cx="150" cy="110" r="78" fill="url(#pg)"/>
  <!-- 自转的表面条纹（两份拼接，无缝循环） -->
  <g clip-path="url(#pclip)">
    <g class="rot">
      <ellipse cx="40"  cy="88"  rx="26" ry="10" fill="#58a6ff" opacity=".30"/>
      <ellipse cx="118" cy="128" rx="30" ry="12" fill="#39d2c0" opacity=".26"/>
      <ellipse cx="196" cy="78"  rx="22" ry="9"  fill="#bc8cff" opacity=".22"/>
      <ellipse cx="272" cy="126" rx="28" ry="11" fill="#58a6ff" opacity=".28"/>
      <ellipse cx="330" cy="95"  rx="20" ry="8"  fill="#39d2c0" opacity=".2"/>
      <ellipse cx="360" cy="88"  rx="26" ry="10" fill="#58a6ff" opacity=".30"/>
      <ellipse cx="438" cy="128" rx="30" ry="12" fill="#39d2c0" opacity=".26"/>
      <ellipse cx="516" cy="78"  rx="22" ry="9"  fill="#bc8cff" opacity=".22"/>
      <ellipse cx="592" cy="126" rx="28" ry="11" fill="#58a6ff" opacity=".28"/>
      <ellipse cx="650" cy="95"  rx="20" ry="8"  fill="#39d2c0" opacity=".2"/>
    </g>
    <!-- 晨昏线阴影 -->
    <circle cx="150" cy="110" r="78" fill="#0d1117" opacity=".22" transform="translate(26,10)"/>
  </g>

  <!-- 星环（前半，盖在星球上） -->
  <g transform="rotate(-16 150 110)">
    <path d="M 22,110 A 128,30 0 0 0 278,110" fill="none" stroke="#8b949e" stroke-width="7" opacity=".95"/>
    <path d="M 22,110 A 128,30 0 0 0 278,110" fill="none" stroke="#e6edf3" stroke-width="1.6" opacity=".5"/>
  </g>

  <!-- 绕行的卫星 -->
  <g transform="rotate(-16 150 110)">
    <g>
      <animateMotion dur="11s" repeatCount="indefinite" path="M 310,110 A 160,55 0 1 0 -10,110 A 160,55 0 1 0 310,110"/>
      <circle cx="0" cy="0" r="7" fill="#e6edf3"/>
      <circle cx="-2" cy="-2" r="1.8" fill="#b8c4cf"/>
      <circle cx="2.5" cy="1.5" r="1.2" fill="#b8c4cf"/>
      <rect x="10" y="-2" width="7" height="4" fill="#58a6ff" rx="1"/>
      <rect x="-17" y="-2" width="7" height="4" fill="#58a6ff" rx="1"/>
    </g>
  </g>

  <text x="368" y="208" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" letter-spacing="4" fill="#8b949e">STAY CURIOUS</text>
</svg>
