# 贪吃蛇：每天自动吞噬一遍贡献图，生成明暗两版 SVG
# 生成结果推送到 output 分支，README 通过 jsDelivr 引用
name: Generate Snake

on:
  schedule:
    - cron: "0 16 * * *" # UTC 16:00 = 北京时间 0:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 生成贪吃蛇动画（蛇身主题色与主页配色保持一致）
      - name: Generate snake grids
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%230ea5a0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339d2c0

      # 推送到 output 分支
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
